<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/></marker><style>.title{font:700 34px Segoe UI,Arial;fill:#172033}.sub{font:500 18px Segoe UI,Arial;fill:#596579}.label{font:700 20px Segoe UI,Arial;fill:#172033}.small{font:500 15px Segoe UI,Arial;fill:#4b5563}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.green{fill:#ecfdf5;stroke:#70c28e}.red{fill:#fff1f2;stroke:#f08b9a}.line{stroke:#15803d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="60" y="64" class="title">Toxic Comment Classification System</text><text x="60" y="95" class="sub">A responsible NLP workflow for classifying online comments as screening signals, not final moderation decisions.</text><rect x="55" y="145" width="170" height="105" class="box green"/><text x="92" y="184" class="label">Dataset</text><text x="89" y="214" class="small">comments + labels</text><rect x="270" y="145" width="170" height="105" class="box"/><text x="313" y="184" class="label">Clean</text><text x="300" y="214" class="small">validate records</text><rect x="485" y="145" width="185" height="105" class="box"/><text x="520" y="184" class="label">TF-IDF</text><text x="510" y="214" class="small">word + character</text><rect x="715" y="145" width="190" height="105" class="box"/><text x="752" y="184" class="label">Model</text><text x="742" y="214" class="small">balanced baseline</text><rect x="950" y="145" width="190" height="105" class="box green"/><text x="987" y="184" class="label">Artifacts</text><text x="977" y="214" class="small">metrics + pipeline</text><path d="M225 198 H270" class="line"/><path d="M440 198 H485" class="line"/><path d="M670 198 H715" class="line"/><path d="M905 198 H950" class="line"/><text x="70" y="330" class="label">Responsible-use path</text><rect x="70" y="365" width="210" height="100" class="box red"/><text x="105" y="404" class="label">Prediction</text><text x="100" y="433" class="small">probability signal</text><rect x="340" y="365" width="210" height="100" class="box red"/><text x="382" y="404" class="label">Threshold</text><text x="371" y="433" class="small">platform-specific</text><rect x="610" y="365" width="210" height="100" class="box red"/><text x="642" y="404" class="label">Human Review</text><text x="650" y="433" class="small">context + appeal</text><rect x="880" y="365" width="210" height="100" class="box red"/><text x="925" y="404" class="label">Decision</text><text x="912" y="433" class="small">not automated blindly</text><path d="M280 415 H340" class="line"/><path d="M550 415 H610" class="line"/><path d="M820 415 H880" class="line"/><rect x="110" y="565" width="980" height="70" class="box"/><text x="145" y="607" class="label">Main point:</text><text x="268" y="607" class="small">The README explains both the ML pipeline and the ethical boundary around moderation use.</text></svg>

