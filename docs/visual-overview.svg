<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Toxic Comment Classification System visual overview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/></marker>
    <style>.title{font:700 34px Segoe UI,Arial,sans-serif;fill:#111827}.sub{font:500 18px Segoe UI,Arial,sans-serif;fill:#4b5563}.section{font:700 20px Segoe UI,Arial,sans-serif;fill:#111827}.label{font:700 18px Segoe UI,Arial,sans-serif;fill:#111827}.small{font:500 14px Segoe UI,Arial,sans-serif;fill:#4b5563}.box{fill:#ffffff;stroke:#d0d7e2;stroke-width:2;rx:18}.soft{fill:#ecfdf5;stroke:#15803d;stroke-width:2;rx:18}.line{stroke:#15803d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="60" y="64" class="title">Toxic Comment Classification System</text>
  <text x="60" y="96" class="sub">A responsible NLP workflow for classifying online comments as review signals.</text>
  <text x="60" y="145" class="section">Machine Learning Pipeline</text>
  <rect x="60" y="175" width="180" height="105" class="soft"/><text x="109" y="215" class="label">Dataset</text><text x="102" y="244" class="small">comments</text>
  <rect x="300" y="175" width="180" height="105" class="box"/><text x="351" y="215" class="label">Clean</text><text x="328" y="244" class="small">valid labels</text>
  <rect x="540" y="175" width="180" height="105" class="box"/><text x="592" y="215" class="label">TF-IDF</text><text x="580" y="244" class="small">text features</text>
  <rect x="780" y="175" width="180" height="105" class="box"/><text x="827" y="215" class="label">Model</text><text x="812" y="244" class="small">baseline</text>
  <rect x="1020" y="175" width="130" height="105" class="soft"/><text x="1048" y="215" class="label">Report</text><text x="1045" y="244" class="small">metrics</text>
  <path d="M240 228 H300" class="line"/><path d="M480 228 H540" class="line"/><path d="M720 228 H780" class="line"/><path d="M960 228 H1020" class="line"/>

  <text x="60" y="350" class="section">Responsible Use</text>
  <rect x="90" y="380" width="230" height="96" class="box"/><text x="138" y="419" class="label">Prediction</text><text x="136" y="448" class="small">screening signal</text>
  <rect x="370" y="380" width="230" height="96" class="box"/><text x="420" y="419" class="label">Threshold</text><text x="418" y="448" class="small">platform tuned</text>
  <rect x="650" y="380" width="230" height="96" class="box"/><text x="693" y="419" class="label">Human Review</text><text x="713" y="448" class="small">context</text>
  <rect x="930" y="380" width="190" height="96" class="box"/><text x="975" y="419" class="label">Decision</text><text x="975" y="448" class="small">appealable</text>
  <path d="M320 428 H370" class="line"/><path d="M600 428 H650" class="line"/><path d="M880 428 H930" class="line"/>

  <text x="60" y="550" class="section">Main Point</text>
  <rect x="90" y="580" width="1030" height="92" class="soft"/><text x="125" y="621" class="label">Responsible ML packaging</text><text x="125" y="650" class="small">The project explains the model, dataset limits, evaluation metrics, and why moderation decisions still need people.</text>
</svg>
